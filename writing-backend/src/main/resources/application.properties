server.port=9899
spring.application.name=writing-backend
spring.datasource.url=${WRITING_DB_URL:jdbc:mysql://localhost:3306/writing_vault?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${WRITING_DB_USERNAME:root}
spring.datasource.password=${WRITING_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
writing.owner.username=${WRITING_OWNER_USERNAME:owner}
writing.owner.password=${WRITING_OWNER_PASSWORD:change-me}
writing.public.code=${WRITING_PUBLIC_CODE:1234}
writing.cors.origin=${WRITING_CORS_ORIGIN:http://localhost:5174}