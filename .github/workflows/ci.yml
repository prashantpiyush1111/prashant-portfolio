name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portfolio_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend test and build
        working-directory: frontend
        run: |
          npm ci
          npm run test
          npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Backend tests and verify
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/portfolio_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
          DB_USERNAME: root
          DB_PASSWORD: root
        run: mvn -B clean verify
      - name: Backend restart twice and capture raw /api/skills output
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/portfolio_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          JAR=$(find target -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' | head -n 1)
          test -n "$JAR"
          java -jar "$JAR" > /tmp/backend-first.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/skills > /tmp/skills-first.json; then break; fi
            sleep 2
          done
          python3 - <<'PY'
          import json
          rows=json.load(open('/tmp/skills-first.json'))
          assert len(rows)==10, f'first startup returned {len(rows)} skills'
          print(open('/tmp/skills-first.json').read())
          PY
          kill $PID
          wait $PID 2>/dev/null || true
          java -jar "$JAR" > /tmp/backend-second.log 2>&1 &
          PID=$!
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/skills > /tmp/skills-second.json; then break; fi
            sleep 2
          done
          python3 - <<'PY'
          import json
          rows=json.load(open('/tmp/skills-second.json'))
          assert len(rows)==10, f'second startup returned {len(rows)} skills'
          print(open('/tmp/skills-second.json').read())
          PY
          kill $PID
          wait $PID 2>/dev/null || true
          trap - EXIT
          {
            echo '# Raw /api/skills verification'
            echo
            echo '## First startup'
            echo
            cat /tmp/skills-first.json
            echo
            echo '## Second startup'
            echo
            cat /tmp/skills-second.json
          } > ../VERIFICATION_RESULT.md

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deployment placeholders
        run: |
          echo "CI is green. Add deployment secrets before enabling provider triggers."
          echo "Expected placeholders: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID"
          echo "Expected placeholders: RENDER_DEPLOY_HOOK_URL or equivalent Render token/service ID"
          echo "No deployment request is sent until secrets are configured."
      - name: Optional Vercel deploy placeholder
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
        run: echo "Vercel secrets detected; wire the provider-specific CLI command here."
      - name: Optional Render deploy placeholder
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
