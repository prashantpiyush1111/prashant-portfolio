name: Portfolio Hardening Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portfolio_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend install, test and build
        working-directory: frontend
        run: npm install && npm run test && npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Backend clean verify
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/portfolio_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
          DB_USERNAME: root
          DB_PASSWORD: root
        run: mvn -B clean verify
      - name: Docker compose config validation
        run: docker compose config
