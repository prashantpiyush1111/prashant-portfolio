spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portfolio_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.mail.host=${MAIL_HOST:}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
portfolio.mail.to=${MAIL_TO:}
portfolio.public-url=${PORTFOLIO_PUBLIC_URL:http://localhost:5173}
server.port=8080
spring.mvc.throw-exception-if-no-handler-found=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
